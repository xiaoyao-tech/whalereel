<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鲸片 · 片头</title>
<link rel="stylesheet" href="common.css">
<style>
  .stage { background: #0B1220; color: #F4EFE4; }
  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .whale { width: 96px; height: 96px; opacity: 0; margin-bottom: 22px; }
  .brand {
    font-family: "Songti SC", "STSong", serif;
    font-size: 112px; letter-spacing: .22em; text-indent: .22em;
    line-height: 1; opacity: 0;
  }
  .en {
    margin-top: 18px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px; letter-spacing: .58em; text-indent: .58em;
    opacity: 0; color: #CFC8B8;
  }
  .tag {
    margin-top: 42px;
    font-family: "Songti SC", "STSong", serif;
    font-size: 22px; letter-spacing: .18em;
    opacity: 0; color: #E6DECD;
  }
  .line {
    margin-top: 26px; height: 1px; width: 0;
    background: rgba(244,239,228,.35);
  }
  .dot {
    position: absolute; left: 50%; bottom: 54px; width: 5px; height: 5px;
    margin-left: -2.5px; border-radius: 50%; background: #C0583E; opacity: 0;
  }
</style>
</head>
<body>
<div class="stage grain">
  <div class="center">
    <svg class="whale" id="whale" viewBox="0 0 120 120" fill="none">
      <path d="M16 64C26 41 57 32 82 44c10 5 16 14 18 22-8 6-18 8-28 6l-12 12 4-14C48 70 31 68 16 64Z"
            stroke="#F4EFE4" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="82" cy="52" r="2.6" fill="#F4EFE4"/>
      <path d="M38 41c-4-8 0-14 6-16" stroke="#F4EFE4" stroke-width="3" stroke-linecap="round"/>
      <path d="M44 36c-2-5 0-8 3-9" stroke="#F4EFE4" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="brand" id="brand">鲸片</div>
    <div class="en" id="en">WHALEREEL</div>
    <div class="line" id="line"></div>
    <div class="tag" id="tag">一句话，六种风格，直接出片。</div>
  </div>
  <div class="dot" id="dot"></div>
</div>

<script src="common.js"></script>
<script>
  const whale = document.getElementById("whale");
  const brand = document.getElementById("brand");
  const en = document.getElementById("en");
  const line = document.getElementById("line");
  const tag = document.getElementById("tag");
  const dot = document.getElementById("dot");

  function seek(t) {
    const wp = ramp(t, 0.05, 0.7);
    whale.style.opacity = String(wp);
    whale.style.transform = `scale(${0.86 + 0.14 * wp})`;

    const bp = ramp(t, 0.35, 0.7);
    brand.style.opacity = String(bp);
    brand.style.transform = `translateY(${(1 - bp) * 16}px)`;

    const ep = ramp(t, 0.75, 0.6);
    en.style.opacity = String(ep * 0.7);

    const lp = easeInOut(clamp((t - 1.0) / 0.6, 0, 1));
    line.style.width = `${240 * lp}px`;

    const tp = ramp(t, 1.25, 0.6);
    tag.style.opacity = String(tp);
    tag.style.transform = `translateY(${(1 - tp) * 8}px)`;

    dot.style.opacity = String(ramp(t, 1.8, 0.4));
  }

  window.__preview = 2.2;
  boot(seek, 3);
</script>
</body>
</html>
